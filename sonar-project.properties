sonar.projectKey=MadhaviRamani_Recap_Project-6
sonar.organization=madhaviramani

sonar.sourceEncoding=UTF-8

# Source code: everything in src except the tests
sonar.sources=src
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx

# Tests: marked as tests, not as source code
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx

# Coverage report written by `npm run coverage`
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Entry and setup files without tests
sonar.coverage.exclusions=src/index.tsx,src/setupTests.ts,src/vite-env.d.ts
